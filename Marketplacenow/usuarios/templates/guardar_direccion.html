{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-4 gap-6 mt-8">

  <!-- Sidebar Izquierdo -->
  <aside class="bg-white p-4 shadow rounded-md col-span-1 space-y-4 text-sm">
    <h3 class="text-lg font-bold text-gray-700">Centro Personal</h3>
    <ul class="space-y-1">
      <li><a href="{% url 'perfil' %}" class="hover:text-red-600">Mis Pedidos</a></li>
      <li><a href="{% url 'detalle' %}" class="hover:text-red-600">Detalles De Perfil</a></li>
      <li><a href="{% url 'direccion' %}" class="hover:text-red-600">Direcciones</a></li>
    </ul>

    <form action="{% url 'logout' %}" method="post" class="pt-4">
      {% csrf_token %}
      <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 transition font-semibold text-sm">
        Cerrar Sesión
      </button>
    </form>
  </aside>

  <!-- Formulario dirección -->
  <section class="col-span-1 md:col-span-3">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full">
      <h1 class="text-2xl font-bold text-red-700 mb-6">
        {% if direccion %}Editar Dirección{% else %}Añadir Dirección{% endif %}
      </h1>

      <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block font-medium mb-1">Dirección *</label>
          <input type="text" name="direccion" value="{{ direccion.direccion|default_if_none:'' }}"
                  class="w-full border border-gray-300 rounded p-2" required>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Ciudad *</label>
            <input type="text" name="ciudad" value="{{ direccion.ciudad|default_if_none:'' }}"
                    class="w-full border border-gray-300 rounded p-2" required>
          </div>
          <div>
            <label class="block font-medium mb-1">Departamento *</label>
            <input type="text" name="departamento" value="{{ direccion.departamento|default_if_none:'' }}"
                    class="w-full border border-gray-300 rounded p-2" required>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-medium mb-1">Código Postal *</label>
            <input type="text" name="codigo_postal" value="{{ direccion.codigo_postal|default_if_none:'' }}"
                    class="w-full border border-gray-300 rounded p-2" required>
          </div>
          <div>
            <label class="block font-medium mb-1">Teléfono *</label>
            <input type="text" name="telefono" value="{{ direccion.telefono|default_if_none:'' }}"
                    class="w-full border border-gray-300 rounded p-2" required>
          </div>
        </div>

        <div class="mt-6">
          <button type="submit" class="bg-red-700 text-white px-6 py-3 rounded hover:bg-red-800">
            Guardar Dirección
          </button>
          <a href="{% url 'direccion' %}" class="ml-4 text-sm text-gray-600 hover:underline">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
