{% extends "base.html" %}
{% load static %}

{% block title %}Correo Enviado{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-20 bg-white p-8 rounded shadow text-center">
    <h1 class="text-2xl font-bold text-red-700 mb-4">📧 Revisa tu correo</h1>
    <p class="text-gray-700">
        Si existe una cuenta asociada a ese correo, te hemos enviado instrucciones para restablecer tu contraseña.
    </p>
    <div class="mt-6">
        <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
