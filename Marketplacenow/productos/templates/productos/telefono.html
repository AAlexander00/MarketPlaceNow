{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="max-w-7xl mx-auto px-4 mt-16">
    <h2 class="text-3xl font-bold text-red-700 mb-8 text-center">Teléfonos</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
        <!-- Producto 1 -->
        <div class="bg-white shadow-md rounded-xl overflow-hidden hover:shadow-lg transition">
            <img src="{% static 'images/telefono1.jpg' %}" alt="Teléfono 1" class="w-full h-60 object-contain bg-white">
            <div class="p-4">
                <h3 class="text-lg font-semibold text-gray-800">Samsung Galaxy S23</h3>
                <p class="text-red-600 font-bold mt-2">$899.000</p>
            </div>
        </div>

        <!-- Producto 2 -->
        <div class="bg-white shadow-md rounded-xl overflow-hidden hover:shadow-lg transition">
            <img src="{% static 'images/telefono2.jpg' %}" alt="Teléfono 2" class="w-full h-60 object-contain bg-white">
            <div class="p-4">
                <h3 class="text-lg font-semibold text-gray-800">iPhone 14</h3>
                <p class="text-red-600 font-bold mt-2">$3.500.000</p>
            </div>
        </div>

        <!-- Producto 3 -->
        <div class="bg-white shadow-md rounded-xl overflow-hidden hover:shadow-lg transition">
            <img src="{% static 'images/telefono3.jpg' %}" alt="Teléfono 3" class="w-full h-60 object-contain bg-white">
            <div class="p-4">
                <h3 class="text-lg font-semibold text-gray-800">Xiaomi Redmi Note 12</h3>
                <p class="text-red-600 font-bold mt-2">$750.000</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
